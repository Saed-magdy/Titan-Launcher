# Automatic build check
#
# In plain words: every time someone opens or updates a pull request (PR) into `dev` or `main`,
# or pushes to them, GitHub builds the launcher on its own computer and shows a green tick
# (it builds) or a red cross (it is broken) on the PR, before anyone reviews it.
#
# It uses a throwaway test key (-TestSign), so the car's real signing key is never needed
# and never uploaded. The APK it makes is only for checking; it does not install in the car.
name: Build check

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android build tools this project needs
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          "y`ny`ny`ny`ny`ny`n" | & $sdkmanager --licenses | Out-Null
          & $sdkmanager "build-tools;28.0.3" "platforms;android-28"

      - name: Check the JavaScript files for syntax errors
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem assets\js\cockpit-*.js, assets\js\shinewave-*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "Syntax error in $($_.Name)"; $bad++ }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Build the APK (test key)
        shell: pwsh
        run: .\build_apk.ps1 -SdkDir $env:ANDROID_HOME -TestSign

      - name: Keep the test APK for 7 days (download it from this run's page)
        uses: actions/upload-artifact@v4
        with:
          name: test-build-apk
          path: bin/Titan_Launcher_v*.apk
          retention-days: 7
